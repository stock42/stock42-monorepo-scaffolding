name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Boundaries
        run: bun run boundaries

      - name: Types
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Dependency audit
        run: bun audit

      - name: Unit tests
        run: bun run test

      - name: Repository tooling tests
        run: bun run test:tools

      - name: Build web applications only
        run: ./build-all.sh

  integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: test
      MONGODB_URI: ${{ secrets.CI_MONGODB_URI }}
      MONGODB_DB: ${{ secrets.CI_MONGODB_DB }}
      AUTH_ACCESS_SECRET: ${{ secrets.CI_AUTH_ACCESS_SECRET }}
      AUTH_REFRESH_SECRET: ${{ secrets.CI_AUTH_REFRESH_SECRET }}
      CSRF_SECRET: ${{ secrets.CI_CSRF_SECRET }}
      WEBSOCKET_TICKET_SECRET: ${{ secrets.CI_WEBSOCKET_TICKET_SECRET }}
      AGENT_SERVICE_TOKEN: ${{ secrets.CI_AGENT_SERVICE_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.CI_DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: deepseek-v4-pro
      DEEPSEEK_REASONING_EFFORT: high
      COOKIE_SECURE: "false"
      API_TEST_ENABLED: "true"
      TEST_TENANT_ID: ${{ secrets.CI_TEST_TENANT_ID }}
      E2E_TENANT_SLUG: ${{ secrets.CI_E2E_TENANT_SLUG }}
      E2E_ADMIN_EMAIL: ${{ secrets.CI_E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.CI_E2E_ADMIN_PASSWORD }}
      E2E_USER_EMAIL: ${{ secrets.CI_E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.CI_E2E_USER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require authorized existing database
        shell: bash
        run: |
          set -Eeuo pipefail
          required=(
            MONGODB_URI MONGODB_DB AUTH_ACCESS_SECRET AUTH_REFRESH_SECRET
            CSRF_SECRET WEBSOCKET_TICKET_SECRET AGENT_SERVICE_TOKEN
            DEEPSEEK_API_KEY TEST_TENANT_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required protected CI configuration: ${name}" >&2
              exit 1
            fi
          done

      - name: API integration against configured MongoDB
        env:
          API_HOST: 127.0.0.1
          API_PORT: "4400"
          AGENT_INTERNAL_URL: http://127.0.0.1:4100
        run: bun run test:api

      - name: Build web applications only
        run: ./build-all.sh

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: End-to-end flows
        shell: bash
        env:
          API_HOST: 127.0.0.1
          API_PORT: "4000"
          AGENT_HOST: 127.0.0.1
          AGENT_PORT: "4100"
          AGENT_INTERNAL_URL: http://127.0.0.1:4100
          API_INTERNAL_URL: http://127.0.0.1:4000
          E2E_ENABLED: "true"
        run: |
          set -Eeuo pipefail
          ./run-all.sh >run-all.ci.log 2>&1 &
          launcher_pid=$!
          cleanup() {
            kill -TERM "${launcher_pid}" 2>/dev/null || true
            wait "${launcher_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4000/health/ready >/dev/null; then
              break
            fi
            if ! kill -0 "${launcher_pid}" 2>/dev/null; then
              tail -n 200 run-all.ci.log >&2
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4000/health/ready >/dev/null
          bun run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure
          if-no-files-found: ignore
          path: |
            run-all.ci.log
            apps/*/playwright-report/
            apps/*/test-results/
