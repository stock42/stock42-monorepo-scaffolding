server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    access_log logs/stock42-webapp.access.log;
    error_log logs/stock42-webapp.error.log;

    include ./snippets/security-headers.conf;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        include ./snippets/proxy-common.conf;
        proxy_pass http://stock42_webapp;
    }
}
